version: 2

# A new version waits a week before it is proposed, as in the catalogs: a release published to do harm is usually withdrawn
# within days.
updates:
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
      - "/lab-ui/templates/catalog/managed"
      - "/lab-ui/templates/catalog/managed/.github/actions/*"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directories:
      - "/seeder"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - "/seeder"
      - "/lab-ui/lab_ui/catalogs/ci/tools"   # the scanners the stages of catalog.py ci run: gitleaks and trivy
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      images:
        patterns: ["*"]
