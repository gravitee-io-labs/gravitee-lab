# The seeder's image, built once here and pushed to GitHub's registry: the lab and the catalogs can then pull it instead of
# building it. For Apple silicon and Intel alike. A catalog publishes the images of its own items by its own workflow.
name: Lab images

on:
  push:
    branches: [main]
    paths:
      - "seeder/**"
      - "!**/*.md"
      - "docker-compose.yml"
      - ".github/workflows/lab-images.yml"
      - ".github/actions/compose/**"
      - ".github/scripts/lab_images.py"
  workflow_dispatch:

permissions:
  contents: read

# A run is never canceled once started: canceling one that is pushing would leave :latest and the :sha tags of
# different builds. The group is per ref, so a run from another branch cannot displace one of main
concurrency:
  group: lab-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    name: Build and push
    # Only main publishes: a run by hand from another branch would overwrite the :latest that everyone pulls.
    # A fork builds on its own push only when started by hand: the lab pulls the images of this repository, so a fork's
    # pushes would be a long multi-platform build for nothing
    if: >-
      ${{ github.ref == 'refs/heads/main'
      && (!github.event.repository.fork || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/compose
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The build cache of GitHub Actions, for the script's builds: an unchanged app is rebuilt in seconds
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: python3 .github/scripts/lab_images.py
        env:
          # The registry names are lower case; the script lower-cases this
          REGISTRY: ghcr.io/${{ github.repository }}
