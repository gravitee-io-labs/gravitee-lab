# The seeder's image, built once here and pushed to GitHub's registry: the lab and the catalogs can then pull it instead of
# building it. For Apple silicon and Intel alike. A catalog publishes the images of its own items by its own workflow.
name: Lab images

on:
  push:
    branches: [main]
    paths:
      - "seeder/**"
      - "!**/*.md"
      - ".github/workflows/lab-images.yml"
  workflow_dispatch:

permissions:
  contents: read

# A run is never canceled once started: canceling one that is pushing would leave :latest and the :sha tags of
# different builds. The group is per ref, so a run from another branch cannot displace one of main
concurrency:
  group: lab-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    name: Build and push
    # Only main publishes: a run by hand from another branch would overwrite the :latest that everyone pulls.
    # A fork builds on its own push only when started by hand: the lab pulls the images of this repository, so a fork's
    # pushes would be a long multi-platform build for nothing
    if: >-
      ${{ github.ref == 'refs/heads/main'
      && (!github.event.repository.fork || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # The one job of the engine that writes a package waits where a catalog's do: the environment publish, which only main and v* tags
    # reach
    environment: publish
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Sign in to the registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The registry's names are lower case. No cache, as in the catalogs (WF17): a build is rare, and what it reads is only what main holds
      - name: Build and push
        run: |
          image=$(printf 'ghcr.io/%s/seeder' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          docker buildx build --platform linux/amd64,linux/arm64 --push -t "$image:latest" -t "$image:sha-${GITHUB_SHA:0:7}" \
            --label org.opencontainers.image.licenses=AGPL-3.0-only \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" seeder
