name: acme-hostels
description: Acme Hostels guests, the website, the hotel agent and the booking MCP server

# Sent as is to PATCH /domains/{id}
settings:
  oidc:
    clientRegistrationSettings:      # a new domain refuses http and localhost redirect URIs
      allowLocalhostRedirectUri: true
      allowHttpSchemeRedirectUri: true
  # A new domain has token exchange off, and turning on only `enabled` lets any client mint a token that is the guest
  # (impersonation): the agent may only act for the guest, so it is delegation alone
  tokenExchangeSettings:
    enabled: true
    allowDelegation: true
    allowImpersonation: false
    maxDelegationDepth: 25
    allowedSubjectTokenTypes:
      - urn:ietf:params:oauth:token-type:access_token
      - urn:ietf:params:oauth:token-type:refresh_token
      - urn:ietf:params:oauth:token-type:id_token
      - urn:ietf:params:oauth:token-type:jwt
    allowedRequestedTokenTypes:
      - urn:ietf:params:oauth:token-type:access_token
      - urn:ietf:params:oauth:token-type:id_token
    allowedActorTokenTypes:
      - urn:ietf:params:oauth:token-type:access_token
      - urn:ietf:params:oauth:token-type:id_token
      - urn:ietf:params:oauth:token-type:jwt
    tokenExchangeOAuthSettings:
      inherited: false
      scopeHandling: downscoping

users:
  - username: john.doe@gravitee.io
    email: john.doe@gravitee.io
    firstName: John
    lastName: Doe
    password: "${DEMO_PASSWORD}"

# The engine that answers the gateway's AuthZEN calls: the store and model come from seed/openfga
authorizationEngines:
  - type: openfga
    name: OpenFGA
    store: Hotel Booking Authorization Model
    connectionUri: ${OPENFGA_URL}
    optional: true            # needs the Enterprise authorization engine pack
