# A version of the Lab is a tag vX.Y.Z on main. Its release on GitHub lists the pull requests merged since the version before it,
# the same changes the Lab UI shows before an update.
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish the release
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Only main and v* tags reach the environment publish, as for the images
    environment: publish
    permissions:
      contents: write
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF_NAME" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "$GITHUB_REF_NAME is not a version (vX.Y.Z)"; exit 1 ;;
          esac
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "The release $GITHUB_REF_NAME exists already"
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
              --title "Gravitee Lab ${GITHUB_REF_NAME#v}"
          fi
