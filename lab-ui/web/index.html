      <a class="nav-item" href="#/plugins" data-nav="plugins" aria-label="Plugins" data-tip="Plugins" data-tip-collapsed><svg aria-hidden="true" focusable="false"><use href="#i-plug"/></svg><span>Plugins</span></a>
      <a class="nav-item" href="#/cloud" data-nav="cloud" aria-label="Gravitee Cloud" data-tip="Gravitee Cloud" data-tip-collapsed><svg aria-hidden="true" focusable="false"><use href="#i-cloud"/></svg><span>Gravitee Cloud</span></a>
    </nav>
    <div class="sidebar-foot">
      <a class="health" id="health" href="#/containers"><span class="state busy" id="health-state"><span id="health-text">Connecting</span></span></a>
      <span class="sr-only" id="health-said" role="status"></span>
      <span class="sr-only" id="job-said" role="status"></span>
      <button class="activity meter" id="activity" hidden>
        <span class="activity-icon"></span><span id="activity-text"></span>
        <span class="progress" data-progress="job" role="progressbar" aria-label="Activity progress" aria-valuemin="0" aria-valuemax="100" hidden><span></span></span>
      </button>
      <div class="sidebar-tools">
        <button class="icon-btn" id="welcome" aria-label="How Gravitee Lab works" data-tip="How Gravitee Lab works"><svg aria-hidden="true" focusable="false"><use href="#i-info"/></svg></button>
        <button class="icon-btn" id="theme" aria-label="System theme" data-tip="System theme"><svg aria-hidden="true" focusable="false"><use href="#i-auto"/></svg></button>
        <button class="icon-btn" id="sidebar-toggle" aria-label="Collapse the menu" data-tip="Collapse the menu"><svg aria-hidden="true" focusable="false"><use href="#i-sidebar"/></svg></button>
      </div>
    </div>
  </aside>

  <!-- Each page fills its own section -->
  <main id="content" tabindex="-1">
    <div class="banner" id="banner" role="status" hidden></div>
    <div class="boot" id="boot"></div>
    <section class="page" id="page-dashboard" hidden></section>
    <section class="page" id="page-playgrounds" hidden></section>
    <section class="page" id="page-playground" hidden></section>
    <section class="page" id="page-setups" hidden></section>
    <section class="page" id="page-addons" hidden></section>
    <section class="page" id="page-catalogs" hidden></section>
    <section class="page" id="page-stack" hidden></section>
    <section class="page fill" id="page-logs" hidden></section>
    <section class="page" id="page-images" hidden></section>
    <section class="page" id="page-plugins" hidden></section>
    <section class="page" id="page-cloud" hidden></section>
  </main>

  <!-- The menu of a "more" or "Open" button -->
  <div class="menu-pop" id="menu" role="menu" aria-label="Menu" hidden></div>

  <!-- The picker: a tag, a version, a registry, or what filters a list; shared by every field that opens it -->
  <div class="combo-pop" id="combo-pop" hidden role="dialog" aria-label="Choose a value">
    <div class="combo-search"><svg aria-hidden="true" focusable="false"><use href="#i-search"/></svg><input id="combo-input" placeholder="Search…" aria-label="Search" aria-controls="combo-list" role="combobox" aria-expanded="true" autocomplete="off" spellcheck="false"></div>
    <div class="combo-bar" id="combo-bar"></div>
    <div class="combo-list" id="combo-list" role="listbox" tabindex="-1"></div>
    <div class="combo-foot" id="combo-foot"></div>
  </div>

  <!-- Activity drawer -->
  <aside class="drawer" id="drawer" role="dialog" aria-modal="false" aria-labelledby="job-title" hidden>
    <div class="dialog-head drawer-head">
      <span class="job-state" id="job-state"></span>
      <h2 class="drawer-title" id="job-title">Activity</h2>
      <span class="sub" id="job-time"></span>
      <div class="drawer-progress" id="job-progress" hidden>
        <span class="progress" data-progress="job" role="progressbar" aria-label="Activity progress" aria-valuemin="0" aria-valuemax="100" hidden><span></span></span>
      </div>
      <button class="icon-btn" id="drawer-close" aria-label="Close" data-tip="Close"><svg aria-hidden="true" focusable="false"><use href="#i-close"/></svg></button>
    </div>
    <div class="job-body">
      <ul class="job-steps" id="job-steps" hidden></ul>
      <div class="job-log-head" id="job-log-head" hidden>
        <span>Output</span>
        <span class="job-log-tools">
          <label class="toggle-chip"><input type="checkbox" id="job-raw"><span>All lines</span></label>
          <!-- Cancel is drawn in this place by jobs.js -->
          <button id="job-cancel" hidden></button>
        </span>
      </div>
      <pre id="job-output"></pre>
    </div>
  </aside>

  <!-- What an action does, with a choice when there are several ways -->
  <dialog id="choice" class="choice-dialog" aria-labelledby="choice-title">
    <form method="dialog">
      <h2 id="choice-title"></h2>
      <div class="choice-list" id="choice-list" role="radiogroup"></div>
      <div class="dialog-actions">
        <button class="btn" type="button" id="choice-cancel">Cancel</button>
        <button class="btn primary" value="ok" id="choice-ok"></button>
      </div>
    </form>
  </dialog>

  <dialog id="confirm" aria-labelledby="confirm-title">
    <form method="dialog">
      <h2 id="confirm-title"></h2>
      <p id="confirm-text" class="sub"></p>
      <label class="search"><input id="confirm-input" autocomplete="off"></label>
      <div class="dialog-actions">
        <button class="btn" type="button" id="confirm-cancel">Cancel</button>
        <button class="btn danger" value="ok" id="confirm-ok"></button>
      </div>
    </form>
  </dialog>

  <div class="toasts" id="toasts"></div>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
