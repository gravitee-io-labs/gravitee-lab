# Managed by the Lab catalog standard 3: change it with catalog.py upgrade, in a pull request a maintainer reads.
version: 2

# A new version waits a week before it is proposed: a release published to do harm is usually withdrawn within days.
updates:
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - "/playgrounds/*/apps/*"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      images:
        patterns: ["*"]

  - package-ecosystem: pip
    directories:
      - "/playgrounds/*/apps/*"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]
