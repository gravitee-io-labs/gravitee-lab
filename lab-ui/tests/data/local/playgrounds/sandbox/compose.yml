x-gravitee: {kind: playground, name: Sandbox, category: Other, description: "Playground of this machine that tries Scratch",
             tags: [Gateway], duration: 5 min, first_start: 1 min}
include:
  - ../../addons/scratch/compose.yml
services:
  sandbox-seed:
    image: __SEEDER_IMAGE__
    build: ../../../../../seeder
    pull_policy: ${SANDBOX_PULL_POLICY:-build}   # build: build it here at each start; always: pull it, build it here if it cannot be pulled
    container_name: gio-sandbox-seed
    restart: "no"
    labels: {io.gravitee.role: seed, io.gravitee.name: Playground seed, io.gravitee.description: Sets up the sandbox in API Management}
    depends_on: {apim-management-api: {condition: service_healthy}}
    volumes: ["./seed:/seed:ro", "./.state:/state"]   # What the seed holds, and what it created
    environment:
      APIM_MANAGEMENT_URL: "http://apim-management-api:8083"
      SANDBOX_BACKEND_URL: "https://backend.example.invalid"   # The API behind the gateway
    networks: [internal]
