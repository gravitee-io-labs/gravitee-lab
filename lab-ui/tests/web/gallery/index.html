<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lab UI components</title>
  <!-- For reviewers only: every component of the Lab UI in every tone and state, light and dark side by side. Not linked from the
       product. Serve lab-ui/ with any static server and open /tests/gallery/ (README.md says how). -->
  <link rel="stylesheet" href="../../../web/css/base.css">
  <link rel="stylesheet" href="../../../web/css/components.css">
  <link rel="stylesheet" href="../../../web/css/pages.css">
  <style>
    body { display: block; padding: 24px; }
    .gal { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .gal-theme { padding: 24px; border-radius: var(--radius); background: var(--bg); color: var(--text); display: grid; gap: 24px; align-content: start; }
    .gal-theme > h1 { font-size: var(--fs-4); }
    .gal-block { display: grid; gap: 12px; container-type: inline-size; }
    .gal-block > h2 { font-size: var(--fs-1); font-weight: var(--fw-2); color: var(--muted); }
    .gal-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
    .gal-swatch { display: grid; gap: 4px; width: 104px; font-size: var(--fs-1); color: var(--muted); }
    .gal-swatch > span:first-child { height: 32px; border-radius: var(--r-control); box-shadow: inset 0 0 0 1px var(--border); }
    .gal-open .tip > :is(.tip-text, .tip-card) { position: static; visibility: visible; opacity: 1; margin-top: 8px; }
    .gal-open .tip { flex-direction: column; align-items: flex-start; }
    .gal-type > * { display: block; }
    .gal-card { overflow: hidden; }
    .gal-stack { display: grid; gap: 24px; }
    .gal-narrow { max-width: 440px; }
    .gal-pop { position: static; animation: none; width: 320px; }   /* popup.js sizes them on a page */
    .gal-dialog { padding: var(--sp-5); border: 1px solid var(--border-strong); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow-lg); max-width: 480px; }
  </style>
</head>
<body>
  <div id="sprite"></div>
  <dialog id="confirm"><button id="confirm-cancel"></button></dialog>
  <dialog id="choice"><button id="choice-cancel"></button></dialog>
  <div id="toasts" class="toasts"></div>
  <div class="gal"><section class="gal-theme" data-gallery="light"></section><section class="gal-theme" data-gallery="dark"></section></div>
  <script type="module" src="gallery.js"></script>
</body>
</html>
