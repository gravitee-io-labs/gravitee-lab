# Pins that Dependabot does not update, to review by hand:
#   Compose     the default version of .github/actions/compose; the step "Check with the newest Compose" of the job
#               "Compose files" says when a newer release breaks the lab
#   Node image  NODE_IMAGE in the Makefile (tag and digest), read by the catalogs' app tests
#   ruff        the ruff~=0.17.0 requirement in the Makefile, installed by make setup
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A pull request keeps its newest run. Each commit of main keeps its own: a run that waits is never dropped for a newer one, so no
# commit of main shows a canceled CI
concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RUFF_OUTPUT_FORMAT: github
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Lint
        run: make setup && make lint

  # Every add-on, setup and playground, then the project as a whole, with the Compose release the lab pins and with the newest one,
  # which is what a Linux user gets from Docker's repository. Then the builds of the lab-images workflow, printed and not run: every
  # image still resolves from the Compose files
  compose:
    name: Compose files
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Compose
        uses: ./.github/actions/compose
      - name: Check with the Compose the lab pins
        run: make check
      - name: Print the image builds
        run: python3 .github/scripts/lab_images.py --dry-run
        env:
          REGISTRY: ghcr.io/${{ github.repository }}
      - name: Install the newest Compose
        uses: ./.github/actions/compose
        with:
          version: latest
      - name: Check with the newest Compose
        run: make check

  # The Makefile's messages and helpers, the images script, the workflows and the conventions of the Compose files
  repository:
    name: Repository tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the tests
        run: python3 -m unittest discover -s .github/tests -t .github/tests

  # The seeder's dependencies need Python 3.10 or later; its image runs 3.14
  seeder:
    name: Seeder tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install the dependencies
        run: make setup
      # Straight to the seeder's tests: make test runs the Lab UI's first, which its own job already runs, and stops at
      # the first failure
      - name: Run the tests
        run: .venv/bin/python -m unittest discover -s seeder/tests -t seeder

  # The Lab UI runs on Python 3.9 or later and ships JavaScript that Node tests. Python 3.9 has no build for newer
  # runner images, hence the pinned one.
  # The suite renders many files with Compose, so it is split in four parts: the modules, largest first, are dealt out in turn.
  lab-ui:
    name: Lab UI tests (Python ${{ matrix.python }}, part ${{ matrix.part }} of 4)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.14"]
        part: [1, 2, 3, 4]
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # The tests that read the playgrounds of the repository render them with Compose, which needs the release the lab needs
      - name: Install Compose
        uses: ./.github/actions/compose
      - name: Run the tests
        run: python lab-ui/tests/run.py -j 2 --shard "$((PART - 1))/4"
        env:
          PART: ${{ matrix.part }}

  # The one check a ruleset asks for, with E2E result: every job above ended in success
  result:
    name: CI result
    needs: [lint, compose, repository, seeder, lab-ui]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job ended well
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "jobs: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || { echo "::error::A job ended $result: open the red job above"; exit 1; }
          done
