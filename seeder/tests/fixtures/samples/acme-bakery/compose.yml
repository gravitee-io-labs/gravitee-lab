# Demo secrets; change one in the shell
x-bank-secrets:
  demo-password: &demo-password ${ACME_BAKERY_DEMO_PASSWORD:-HelloWorld@123}                             # Password of Alice, Bob and Tina
  web-client-secret: &web-client-secret ${ACME_BAKERY_WEB_CLIENT_SECRET:-acme-bakery-web}                  # Secret of the acme-bakery-web application in Access Management (the web app's sign-in)
  traffic-client-secret: &traffic-client-secret ${ACME_BAKERY_TRAFFIC_CLIENT_SECRET:-acme-bakery-traffic}  # Secret of the acme-bakery-traffic application in Access Management (traffic generator and seed)
  ace-client-secret: &ace-client-secret ${ACME_BAKERY_ACE_CLIENT_SECRET:-ace-agent}                      # Secret of Ace's application in Access Management
  mcp-resource-secret: &mcp-resource-secret ${ACME_BAKERY_MCP_RESOURCE_SECRET:-acme-bakery-mcp}            # Secret of the MCP server's resource in Access Management
  ace-llm-key: &ace-llm-key ${ACME_BAKERY_ACE_LLM_API_KEY:-acme-ace-llm-key}                             # API key of Ace on the LLM proxy
  dev-llm-key: &dev-llm-key ${ACME_BAKERY_DEV_LLM_API_KEY:-acme-dev-llm-key}                             # API key of the Developers plan on the LLM proxy
  traffic-llm-key: &traffic-llm-key ${ACME_BAKERY_TRAFFIC_LLM_API_KEY:-acme-traffic-llm-key}             # API key of the Traffic plan on the LLM proxy
  apim-password: &apim-password ${ACME_BAKERY_APIM_PASSWORD:-admin}                                      # Password of user admin in API Management
  am-password: &am-password ${ACME_BAKERY_AM_PASSWORD:-adminadmin}                                       # Password of user admin in Access Management

# Administrator login for the seed
x-bank-platform-login: &platform-login
  APIM_USERNAME: admin
  APIM_PASSWORD: *apim-password

services:
  bakery-seed:
    environment:
      <<: *platform-login
      APIM_MANAGEMENT_URL: http://apim-management-api:8083
      AM_MANAGEMENT_URL: http://am-management-api:8093
      AM_USERNAME: admin
      AM_PASSWORD: *am-password
      APIM_GATEWAY_URL: http://localhost:8082               # The gateway, as you reach it
      GATEWAY_INTERNAL_URL: http://apim-gateway:8082        # The gateway, as the seed reaches it
      GATEWAY_READY_TIMEOUT: ${ACME_BAKERY_GATEWAY_READY_TIMEOUT:-300}  # Seconds the seed waits for the gateway to serve each API (the first start downloads the AI models)
      AM_GATEWAY_URL: http://am-gateway:8092                # Access Management, as the gateway reaches it
      AM_PUBLIC_URL: http://localhost:8092                  # Access Management, as your browser reaches it
      BAKERY_MCP_URL: http://bakery-mcp:8000                    # The MCP server, without a trailing slash
      BAKERY_AGENT_URL: http://bakery-agent:8000                # Ace
      BAKERY_API_URL: http://bakery-api:8000                    # The open API
      BAKERY_WEB_URL: http://localhost:8110                   # The web app, as your browser reaches it
      BAKERY_WEB_LOOPBACK_URL: http://127.0.0.1:8110          # The same, by IP address
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}   # Ollama, as the gateway reaches it
      REDIS_URL: redis://redis:6379                         # The core's Redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redispassword}      # The core's Redis password
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}                   # Optional Google AI Studio key: with one, the catalog gets a Gemini provider; empty seeds none
      SEED_PROTECTIONS: ${ACME_BAKERY_PROTECTIONS:-off}       # State the seed puts the protections in (off or on)
      BANK_DEMO_PASSWORD: *demo-password
      WEB_CLIENT_SECRET: *web-client-secret
      TRAFFIC_CLIENT_SECRET: *traffic-client-secret
      ACE_CLIENT_SECRET: *ace-client-secret
      MCP_RESOURCE_SECRET: *mcp-resource-secret
      ACE_LLM_API_KEY: *ace-llm-key
      DEV_LLM_API_KEY: *dev-llm-key
      LLM_PROBE_KEY: *dev-llm-key                           # Key the seed uses to check the Developers plan cache
      TRAFFIC_LLM_API_KEY: *traffic-llm-key
    labels:
      io.gravitee.name: Playground seed
      io.gravitee.description: Sets up the bank's APIs, applications and identity on the platform
      io.gravitee.role: seed
