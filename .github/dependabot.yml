version: 2

updates:
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
      - "/lab-ui/templates/catalog/managed"
      - "/lab-ui/templates/catalog/managed/.github/actions/*"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directories:
      - "/seeder"
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - "/seeder"
    schedule:
      interval: weekly
    groups:
      images:
        patterns: ["*"]
