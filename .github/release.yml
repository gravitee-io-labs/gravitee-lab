# The changelog of a release: the pull requests merged since the version before, grouped by the label that raised the version.
# "For catalogs" is what a catalog may use from that version on: a catalog that uses it needs that Gravitee Lab or a later one
changelog:
  categories:
    - title: Changes that need you to do something
      labels: [major]
    - title: For catalogs
      labels: [catalog-format]
    - title: New
      labels: [minor]
    - title: Fixes and improvements
      labels: ["*"]
