# Pins that Dependabot does not update, to review by hand:
#   Compose     the default version of .github/actions/compose; the job "check (Compose latest)" says when a newer
#               release breaks the lab
#   Node image  NODE_IMAGE in the Makefile (tag and digest), read by the catalogs' app tests
#   ruff        the ruff~=0.17.0 requirement in the Makefile, installed by make setup
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every add-on, setup and playground, then the project as a whole
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/compose
      - run: make check

  # The same check with the newest Compose release, which is what a Linux user gets from Docker's repository
  check-latest:
    name: check (Compose latest)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/compose
        with:
          version: latest
      - run: make check

  # The Lab UI runs on Python 3.9 or later and ships JavaScript that Node tests. Python 3.9 has no build for newer
  # runner images, hence the pinned one.
  # The suite renders many files with Compose, so it is split in four: the modules, largest first, are dealt out in turn.
  lab-ui:
    name: lab-ui (${{ matrix.python }}, ${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.14"]
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # The tests that read the playgrounds of the repository render them with Compose, which needs the release the lab needs
      - uses: ./.github/actions/compose
      - run: python lab-ui/tests/run.py -j 2 --shard "$SHARD/4"
        env:
          SHARD: ${{ matrix.shard }}

  # The seeder's dependencies need Python 3.10 or later; its image runs 3.14
  seeder:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: make setup
      # Straight to the seeder's tests: make test runs the Lab UI's first, which its own job already runs, and stops at
      # the first failure
      - run: .venv/bin/python -m unittest discover -s seeder/tests -t seeder

  # The Makefile's messages and helpers, the images script, and the conventions of the Compose files
  tooling:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s .github/tests -t .github/tests

  # The builds of the lab-images workflow, printed and not run: every image still resolves from the Compose files
  images:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/compose
      - run: python3 .github/scripts/lab_images.py --dry-run
        env:
          REGISTRY: ghcr.io/${{ github.repository }}

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RUFF_OUTPUT_FORMAT: github
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: make setup && make lint
