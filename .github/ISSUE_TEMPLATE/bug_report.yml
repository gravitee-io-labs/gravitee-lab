name: Bug report
description: Something in the lab does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Check [docs/troubleshooting.md](https://github.com/gravitee-io-labs/gravitee-lab/blob/main/docs/troubleshooting.md) first.
        **Remove secrets before you paste anything**: your license, tokens and passwords, in the logs and in the output of commands.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      description: On Windows, the lab runs in WSL 2
      options:
        - macOS
        - Linux
        - Windows (WSL 2)
    validations:
      required: true
  - type: input
    id: docker
    attributes:
      label: Docker version
      description: Output of `docker --version`
    validations:
      required: true
  - type: input
    id: compose
    attributes:
      label: Docker Compose version
      description: Output of `docker compose version`
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Lab revision
      description: Output of `git rev-parse --short HEAD`
    validations:
      required: true
  - type: textarea
    id: ps
    attributes:
      label: Containers
      description: Output of `make ps`
      render: shell
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The lines that matter, from `make logs SVC=<service>` or the Logs page of the Lab UI, with secrets and license removed
      render: shell
