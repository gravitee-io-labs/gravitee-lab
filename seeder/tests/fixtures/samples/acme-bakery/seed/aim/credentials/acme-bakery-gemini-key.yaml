# The key of the Gemini provider. Gamma tests a Gemini provider against Google with this key as it creates it, so the
# credential and the provider are seeded only with a real key, set in GEMINI_API_KEY. Nothing else in this playground uses them
needs: GEMINI_API_KEY
name: Acme Bakery Gemini key
service: google                                   # the provider service this key can be used with
credentials:
  type: api-key
  headerName: x-goog-api-key
  value: "${GEMINI_API_KEY:-}"
