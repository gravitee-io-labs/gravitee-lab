# Key metrics of the bank's AI gateway and what it refused, built only on what the gateway reports. The grid has 24 columns
# (layout version 2).
id: acme-bakery-ai-spend-and-safety
title: Acme Bakery - AI spend and safety
description: Spend by consumer and model, what the gateway refused, and the authorization decisions
timeRange: {type: relative, period: 1h}   # the templates open on 7 days, where a fresh machine shows one spike at the edge

filters:
  - {name: API, label: API, operator: IN, value: [], editable: true}

widgets:
  - id: key-metrics
    title: Key metrics
    type: metric-group
    # Only the AI proxies count: the dashboard is shared by the whole environment
    filters: [&ai {field: API_TYPE, label: API type, operator: in, value: [LLM, MCP, A2A]}]
    items:
      - {metric: HTTP_REQUESTS, measure: COUNT, label: Requests, category: Traffic, sentiment: neutral}
      - {metric: HTTP_ERROR_RATE, measure: PERCENTAGE, label: Error rate, category: Traffic, sentiment: lower-is-better}
      - {metric: HTTP_GATEWAY_LATENCY, measure: P95, label: P95 gateway latency, category: Traffic, sentiment: lower-is-better}
      - {metric: LLM_PROMPT_TOTAL_TOKEN, measure: COUNT, label: Total, category: Tokens, sentiment: neutral}
      - {metric: LLM_PROMPT_TOKEN_TOTAL_COST, measure: COUNT, label: Total, category: Cost (USD), sentiment: neutral}
    layout: {x: 0, y: 0, cols: 24, rows: 2, version: 2}

  # What the gateway refuses, by the status it answers
  - id: no-valid-token
    title: No valid token
    type: metric
    metric: HTTP_REQUESTS
    measure: COUNT
    label: HTTP 401
    filters: [*ai, {field: HTTP_STATUS, label: Status, operator: eq, value: ["401"]}]
    layout: {x: 0, y: 2, cols: 6, rows: 2, version: 2}
